  release:
    name: Publish to GitHub Releases
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write            # create/update releases and tags
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false  # queue; never kill a half-finished publish
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Caz-app
          path: dist

      - name: Checksums for everything published
        run: |
          set -euo pipefail
          cd dist
          sha256sum Caz.tipa Caz.ipa > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:7}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" dist/* --clobber
            else
              gh release create "$tag" dist/* --verify-tag --title "Caz ${VERSION}" --generate-notes
            fi
          else
            tag="nightly"
            gh release delete "$tag" --cleanup-tag --yes >/dev/null 2>&1 || true
            gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/${tag}" >/dev/null 2>&1 || true
            sleep 3
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --prerelease \
              --title "Nightly ${VERSION} (${short})" \
              --notes "Automated build of ${short}. Caz.tipa and Caz.ipa are the same file; open either with TrollStore."
          fi
